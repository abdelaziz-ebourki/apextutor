services:
  db:
    image: pgvector/pgvector:pg16
    container_name: apextutor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apextutor
      POSTGRES_PASSWORD: apextutor
      POSTGRES_DB: apextutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
